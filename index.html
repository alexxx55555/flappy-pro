<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4fc3e6">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --page-bg: #dfe8ee;
  --page-fg: #22313c;
  --hint: #5b6b78;
  --panel: #fdf1cf;
  --panel-edge: #5a3b1f;
  --card: #fff8e3;
  --card-edge: #d9c391;
  --label: #9b7a4c;
  --ink: #2b2118;
  --btn: #ff8a2b;
  --btn-edge: #9c4410;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #0e1419; --page-fg: #e3ebf1; --hint: #8798a6; color-scheme: dark; }
}
:root[data-theme="dark"] { --page-bg: #0e1419; --page-fg: #e3ebf1; --hint: #8798a6; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--page-bg); color: var(--page-fg);
  font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
#wrap { position: relative; flex: none; }
#stage {
  position: absolute; left: 0; top: 0; width: 360px; height: 640px;
  transform-origin: 0 0; border-radius: 20px; overflow: hidden;
  box-shadow: 0 0 0 4px #2b2118, 0 24px 60px rgba(0,0,0,.35);
  cursor: pointer;
}
canvas { position: absolute; inset: 0; width: 360px; height: 640px; display: block; }

.display { font-family: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif; letter-spacing: .5px; font-weight: 400; }
.outlined {
  color: #fff;
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
    2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 6px 0 var(--ink);
}
.soft-shadow { text-shadow: 0 2px 0 rgba(0,0,0,.35); }

#score { position: absolute; top: 54px; left: 0; right: 0; text-align: center; font-size: 60px; line-height: 1; pointer-events: none; z-index: 5; transition: opacity .2s; }
#score.pop { animation: pop .28s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

.overlay { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
.overlay.show { opacity: 1; visibility: visible; }
.overlay button { pointer-events: auto; }

/* Ready / menu */
#ready .logo { position: absolute; top: 66px; left: 0; right: 0; text-align: center; font-size: 58px; line-height: .9; transform: rotate(-4deg); }
#ready .logo span { display: block; font-size: 40px; color: #ffd23f; }
#ready.show .logo { animation: drop .7s cubic-bezier(.3,1.35,.5,1) both; }
@keyframes drop { 0% { transform: translateY(-160px) rotate(-4deg); } 100% { transform: translateY(0) rotate(-4deg); } }
.modes { position: absolute; top: 190px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(0,0,0,.3); border-radius: 12px; padding: 3px; }
.modes button { font-weight: 800; font-size: 14px; color: #fff; background: transparent; border: 0; border-radius: 9px; padding: 6px 16px; cursor: pointer; }
.modes button.on { background: #fff; color: var(--ink); }
#ready .tap { position: absolute; top: 318px; left: 20px; right: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; font-weight: 900; font-size: 16px; text-align: center; }
.tap-hand { font-size: 30px; animation: tap 1s ease-in-out infinite; }
@keyframes tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
#ready .ready-best { position: absolute; top: 424px; left: 16px; right: 16px; text-align: center; color: #fff; font-weight: 800; font-size: 14px; }
.menu-row { position: absolute; top: 458px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
.menu-btn {
  width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: rgba(255,255,255,.92); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  padding: 7px 0 5px; cursor: pointer; font-weight: 800; font-size: 12px; color: var(--ink);
}
.menu-btn svg { width: 22px; height: 22px; }
.menu-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

/* Game over */
#over { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
#over .go-title { font-size: 50px; transform: translateY(-14px); transition: transform .35s cubic-bezier(.3,1.6,.5,1); text-align: center; line-height: 1; }
#over .go-title small { display: block; font-size: 18px; margin-top: 6px; }
#over.show .go-title { transform: translateY(0); }
.panel {
  width: 286px; background: var(--panel); border: 4px solid var(--panel-edge); border-radius: 14px; box-shadow: 0 6px 0 var(--panel-edge);
  padding: 16px 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; color: var(--ink);
  transform: translateY(40px); transition: transform .4s cubic-bezier(.3,1.4,.5,1);
}
#over.show .panel { transform: translateY(0); }
.medal-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.medal { width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--panel-edge); display: grid; place-items: center; font-size: 30px; color: rgba(255,255,255,.9); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.medal.none { background: #e8dcb4; border-style: dashed; border-color: #b9a77a; color: transparent; text-shadow: none; }
.bronze { background: radial-gradient(circle at 35% 30%, #f3c39a, #c7783e 60%, #8f4f22); }
.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #c4ccd4 60%, #7e8a96); }
.gold { background: radial-gradient(circle at 35% 30%, #fff4b0, #f4c430 60%, #b8860b); }
.platinum { background: radial-gradient(circle at 35% 30%, #ffffff, #bfe9ef 55%, #6fb3c2); }
.medal-name { font-size: 12px; font-weight: 800; color: #8a6d45; min-height: 16px; text-align: center; max-width: 90px; }
.stats { display: flex; flex-direction: column; gap: 8px; text-align: right; }
.stat span { display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: #b5652a; }
.stat b { display: block; font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.05; }
.new { font-style: normal; background: #e8412c; color: #fff; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 10px; display: none; }
.new.show { display: inline-block; animation: pop .4s ease-out; }
.btn {
  font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-size: 22px; letter-spacing: .5px; color: #fff; background: var(--btn);
  border: 3px solid var(--btn-edge); border-radius: 14px; box-shadow: 0 5px 0 var(--btn-edge); padding: 10px 34px; cursor: pointer;
  text-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-edge); }
.btn2 {
  font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-size: 18px; color: var(--ink); background: #fff;
  border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); padding: 7px 20px; cursor: pointer;
}
.btn2:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn-row { display: flex; gap: 10px; align-items: center; }
.small { color: #fff; font-weight: 800; font-size: 14px; }
button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px var(--ink); }

/* Pause + countdown */
#paused { background: rgba(10, 20, 40, .5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
#paused .display { font-size: 52px; }
#countdown { position: absolute; top: 210px; left: 0; right: 0; text-align: center; font-size: 96px; z-index: 7; pointer-events: none; display: none; }

.corner { position: absolute; top: 14px; right: 14px; z-index: 8; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.88); border: 3px solid var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 3px 0 var(--ink); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.hidden { display: none !important; }

/* Bottom sheet */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; background: rgba(10,20,40,.5); display: flex; align-items: flex-end; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; cursor: default; }
.sheet-wrap.show { opacity: 1; visibility: visible; }
.sheet { width: 100%; max-height: 90%; background: var(--panel); border-top: 4px solid var(--panel-edge); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; transform: translateY(30px); transition: transform .25s; color: var(--ink); }
.sheet-wrap.show .sheet { transform: none; }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
.sheet h2 { margin: 0; font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-weight: 400; font-size: 26px; }
.close { width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--panel-edge); background: #fff; font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
.sheet-body { overflow-y: auto; padding: 4px 16px 20px; user-select: text; }
.sheet h3 { font-weight: 900; font-size: 15px; margin: 12px 0 8px; color: #8a5a2b; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--card); border: 3px solid var(--card-edge); border-radius: 12px; padding: 8px 4px; cursor: pointer; color: var(--ink); }
.card img { width: 64px; height: 52px; object-fit: contain; }
.card.world img { width: 120px; height: 80px; border-radius: 8px; border: 2px solid var(--card-edge); }
.card .nm { font-weight: 900; font-size: 13px; }
.card .req { font-weight: 700; font-size: 11px; color: var(--label); min-height: 15px; }
.card.sel { border-color: var(--btn); background: #fff1d6; }
.card.locked { cursor: default; }
.card.locked img { filter: grayscale(1) brightness(.7); opacity: .55; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border: 3px solid var(--card-edge); border-radius: 12px; padding: 8px 10px; }
.tile span { display: block; font-size: 12px; font-weight: 800; color: var(--label); }
.tile b { font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-weight: 400; font-size: 24px; }
.medals { display: flex; justify-content: space-around; background: var(--card); border: 3px solid var(--card-edge); border-radius: 12px; padding: 8px; }
.mm { display: flex; align-items: center; gap: 6px; font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-size: 20px; }
.mm i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--panel-edge); display: inline-block; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; background: var(--card); border: 3px solid var(--card-edge); border-radius: 12px; padding: 8px; }
.bars i { flex: 1; background: var(--btn); border-radius: 2px 2px 0 0; min-height: 2px; }
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
.tabs button { flex: 1; border: 3px solid var(--card-edge); background: var(--card); border-radius: 10px; padding: 6px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); }
.tabs button.on { border-color: var(--btn); background: #fff1d6; }
.rank { display: grid; grid-template-columns: 26px 28px 1fr 30px auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; }
.rank:nth-child(odd) { background: var(--card); }
.rank.me { background: #ffdcae; }
.rank .pos { font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-size: 18px; text-align: center; }
.rank img.av { width: 28px; height: 28px; border-radius: 50%; }
.rank img.bd { width: 30px; height: 24px; object-fit: contain; }
.rank .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .sc { font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; font-size: 20px; text-align: right; }
.muted { color: var(--label); font-weight: 700; font-size: 13px; text-align: center; padding: 12px 4px; margin: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 2px dashed #e6d4a6; font-weight: 800; cursor: pointer; }
.row small { display: block; font-weight: 700; font-size: 12px; color: var(--label); }
.row input[type=range] { width: 140px; accent-color: var(--btn); }
.row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--btn); flex: none; }
.danger { background: #fff; border: 3px solid #c0392b; color: #c0392b; border-radius: 12px; padding: 9px 14px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 16px; width: 100%; }

#toast { position: absolute; top: 118px; left: 50%; transform: translate(-50%, -10px); background: var(--ink); color: #fff; font-weight: 900; font-size: 14px; padding: 8px 14px; border-radius: 12px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 30; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
#fade.on { opacity: 1; }

.hint { margin: 14px 0 0; font-size: 13px; font-weight: 700; color: var(--hint); text-align: center; padding: 0 12px; }
kbd { font-family: inherit; font-size: 12px; font-weight: 800; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 5px; }

.rm *, .rm *::before, .rm *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { .tap-hand, #ready.show .logo { animation: none; } }
</style>
</head>
<body>
<main id="wrap">
  <div id="stage" role="application" aria-label="Flappy Pro game">
    <canvas id="game"></canvas>
    <div id="score" class="display outlined" aria-live="polite">0</div>
    <div id="countdown" class="display outlined" aria-live="assertive"></div>

    <div class="corner">
      <button class="icon-btn hidden" id="pauseBtn" aria-label="Pause">
        <svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1" fill="#2b2118"/><rect x="12" y="3" width="4" height="14" rx="1" fill="#2b2118"/></svg>
      </button>
    </div>

    <div id="ready" class="overlay show">
      <div class="logo display outlined">Flappy<span>Pro</span></div>
      <div class="modes" role="group" aria-label="Game mode">
        <button data-mode="classic" class="on" aria-pressed="true">Classic</button>
        <button data-mode="daily" aria-pressed="false">Daily</button>
      </div>
      <div class="tap soft-shadow">
        <div class="tap-hand" aria-hidden="true">👆</div>
        <div id="tapText">Click or press Space to flap</div>
      </div>
      <div class="ready-best soft-shadow" id="readyBest"></div>
      <nav class="menu-row" aria-label="Menu">
        <button class="menu-btn" data-sheet="shop"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="11" cy="13" rx="8" ry="6.5"/><circle cx="14" cy="11" r="1.4" fill="#2b2118"/><path d="M19 13l3 1.5-3 1.5"/></svg>Birds</button>
        <button class="menu-btn" data-sheet="stats"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Stats</button>
        <button class="menu-btn" data-sheet="ranks"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.2" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 20h8"/></svg>Ranks</button>
        <button class="menu-btn" data-sheet="settings"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
      </nav>
    </div>

    <div id="over" class="overlay">
      <div class="go-title display outlined">Game over<small id="overMode"></small></div>
      <div class="panel">
        <div class="medal-wrap">
          <div id="medal" class="medal none">★</div>
          <div class="medal-name" id="medalName"></div>
        </div>
        <div class="stats">
          <div class="stat"><span>Score</span><b id="finalScore">0</b></div>
          <div class="stat"><span><i class="new" id="newBadge">New</i>Best</span><b id="bestScore">0</b></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="replayBtn">Play again</button>
        <button class="btn2 hidden" id="shareBtn">Share</button>
      </div>
      <div class="small soft-shadow" id="replayHint">or press Space</div>
    </div>

    <div id="paused" class="overlay">
      <div class="display outlined">Paused</div>
      <button class="btn" id="resumeBtn">Resume</button>
      <div class="btn-row">
        <button class="btn2" id="pauseSettingsBtn">Settings</button>
        <button class="btn2" id="quitBtn">Quit run</button>
      </div>
    </div>

    <div id="sheetWrap" class="sheet-wrap" aria-hidden="true">
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" aria-label="Close">×</button></header>
        <div class="sheet-body" id="sheetBody"></div>
      </section>
    </div>

    <div id="toast" role="status"></div>
    <div id="fade"></div>
  </div>
</main>
<p class="hint" id="hint"><kbd>Space</kbd> or click to flap &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> mute</p>
<script>
(() => {
'use strict';

// ===================== Constants & helpers =====================
const W = 360, H = 640, GROUND = 96, FLOOR = H - GROUND, STEP = 1000 / 60, TAU = Math.PI * 2;
const CFG = {
  gravity: 0.32, flap: -6.0, maxFall: 9,
  birdX: 96, radius: 13, hitR: 11,
  pipeW: 62, capH: 26, capOver: 5,
  gapStart: 168, gapMin: 126, speedStart: 2.3, speedMax: 3.5, rampScore: 40, spacing: 210
};
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const hexCache = {};
const hx = h => hexCache[h] || (hexCache[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ===================== Content =====================
const SKINS = {
  classic: { body: '#ffd23f', belly: '#fff3b0', wing: '#f4a01c', beak: '#ff6f3c', outline: '#3b2a12' },
  cardinal: { body: '#e5383b', belly: '#ff9a8f', wing: '#a8181d', beak: '#ffb703', outline: '#3a0c0c', crest: true },

  drawTile(far, 0.3, wx, FLOOR - 200, FAR_W, FAR_H);
  if (world.windows) {
    const win = cachedLayer(`win|${world.id}`, FAR_W, FAR_H, gg => paintWindows(gg, world));
    ctx.globalAlpha = world.far === 'neon' ? Math.max(0.55, pal.night) : pal.night * 0.9;
    if (ctx.globalAlpha > 0.02) drawTile(win, 0.3, wx, FLOOR - 200, FAR_W, FAR_H);
    ctx.globalAlpha = 1;
  }
  const hills = cachedLayer(`hill|${world.id}|${pal.near}`, HILL_W, HILL_H, gg => paintHills(gg, world, pal.near));
  drawTile(hills, 0.55, wx, FLOOR - 78, HILL_W, HILL_H);
  if (world.snow) { ctx.fillStyle = 'rgba(255,255,255,.85)'; for (const f of flakes) { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); } }
  for (const p of pipes) drawPipe(p, lerp(p.px ?? p.x, p.x, a));
  drawGround(world, wx);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (state === 'ready' && tutorial && !sheet) {
    for (const r of ripples) { ctx.globalAlpha = r.life * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, 14 + (1 - r.life) * 26, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const gr = ghost.v < 0 ? -0.42 : clamp((ghost.v - 2) * 0.22, -0.42, 1.2);
    drawBird(ghost.x, ghost.y, gr, 0, ghost.flapT * 2, false, curBird(), 0.45);
  }
  ctx.font = "22px 'Lilita One', 'Arial Rounded MT Bold', sans-serif"; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.lineWidth = 5; ctx.strokeStyle = '#2b2118'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = '#7ff7ff'; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
  drawBird(CFG.birdX, lerp(bird.py, bird.y, a), lerp(bird.prot, bird.rot, a), bird.squash, bird.flapT, state === 'dying' || state === 'over', curBird());
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}

// ===================== Main loop (fixed 60 Hz step + interpolation) =====================
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  if (!paused) {
    if (timeScale < 1) timeScale = Math.min(1, timeScale + dt / 700);
    acc += dt * timeScale;
    let n = 0;
    while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
    if (n === 8) acc = 0;
    renderAlpha = clamp(acc / STEP, 0, 1);
  }
  draw();
  requestAnimationFrame(frame);
}

// ===================== UI =====================
function syncUI() {
  readyEl.classList.toggle('show', state === 'ready');
  scoreEl.style.opacity = (state === 'playing' || state === 'dying') ? 1 : 0;
  pauseBtn.classList.toggle('hidden', state !== 'playing' || paused || !!sheet);
  pausedEl.classList.toggle('show', paused);
  if (!paused && countdown <= 0) countdownEl.style.display = 'none';
  if (state !== 'over') overEl.classList.remove('show');
  stage.classList.toggle('rm', reduced());
  musicDuck = (paused || state === 'over' || state === 'dying' || sheet) ? 0.35 : 1;
  applyVolumes();
}
function renderReady() {
  for (const b of document.querySelectorAll('.modes button')) { const on = b.dataset.mode === mode; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }
  const t = todayStr();
  const tapWord = isTouch ? 'Tap' : 'Click or press Space';
  $('tapText').textContent = !progress.tutorialDone ? `${tapWord} to flap. Each flap gives a little lift, so tap in a rhythm and fly through the gaps.` : `${tapWord} to flap`;
  $('readyBest').textContent = mode === 'daily'
    ? `Today’s course is the same for everyone. Your best today: ${progress.daily.date === t ? progress.daily.score : 0}`
    : (progress.best > 0 ? `Best ${progress.best}` : '');
}
const toastQ = []; let toastBusy = false;
function toast(msg) { toastQ.push(msg); if (!toastBusy) nextToast(); }
function nextToast() {
  const m = toastQ.shift();
  if (!m) { toastBusy = false; return; }
  toastBusy = true; toastEl.textContent = m; toastEl.classList.add('show');
  setTimeout(() => { toastEl.classList.remove('show'); setTimeout(nextToast, 250); }, 2000);
}

const SHEET_TITLES = { shop: 'Birds and worlds', stats: 'Your stats', ranks: 'Leaderboard', settings: 'Settings' };
function openSheet(name) {
  sheet = name; sheetTitle.textContent = SHEET_TITLES[name];
  renderSheet();
  sheetWrap.classList.add('show'); sheetWrap.setAttribute('aria-hidden', 'false');
  $('sheetClose').focus({ preventScroll: true });
  if (name === 'ranks') subscribeRanks();
  syncUI();
}
function closeSheet() {
  sheet = null; sheetWrap.classList.remove('show'); sheetWrap.setAttribute('aria-hidden', 'true');
  resetArmed = false; renderReady(); syncUI();
}
function renderSheet() {
  if (sheet === 'shop') renderShop();
  else if (sheet === 'stats') renderStats();
  else if (sheet === 'ranks') renderRanks();
  else if (sheet === 'settings') renderSettings();
}
function renderShop() {
  const card = (item, kind) => {
    const lock = !unlocked(item), sel = (kind === 'bird' ? curBird() : curWorld().id) === item.id;
    const img = kind === 'bird' ? birdThumb(item.id) : worldThumb(item.id);
    return `<button class="card${kind === 'world' ? ' world' : ''}${sel ? ' sel' : ''}${lock ? ' locked' : ''}" data-act="${kind}" data-id="${item.id}" aria-pressed="${sel}" ${lock ? 'aria-disabled="true"' : ''}>
      <img src="${img}" alt=""><span class="nm">${esc(item.name)}</span><span class="req">${lock ? '🔒 ' + esc(item.hint) : sel ? 'Selected' : ''}</span></button>`;
  };
  sheetBody.innerHTML = `<h3>Birds</h3><div class="grid">${BIRDS.map(b => card(b, 'bird')).join('')}</div>
    <h3>Worlds</h3><div class="grid two">${WORLD_LIST.map(w => card(w, 'world')).join('')}</div>`;
}
function fmtTime(ms) { const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; }
function renderStats() {
  const p = progress, avg = p.games ? (p.total / p.games).toFixed(1) : '0', hist = p.history.slice(-30), mx = Math.max(1, ...hist);
  const today = p.daily.date === todayStr() ? p.daily.score : 0;
  const tile = (label, val) => `<div class="tile"><span>${label}</span><b>${val}</b></div>`;
  sheetBody.innerHTML = `<div class="tiles">
      ${tile('Best (classic)', p.best)}${tile('Today’s daily best', today)}
      ${tile('Games played', p.games)}${tile('Average score', avg)}
      ${tile('Pipes cleared', p.pipes)}${tile('Close calls', p.near)}
      ${tile('Flaps', p.flaps.toLocaleString())}${tile('Time played', fmtTime(p.playMs))}
    </div>
    <h3>Medals</h3>
    <div class="medals">${['bronze', 'silver', 'gold', 'platinum'].map(m => `<div class="mm" title="${m}"><i class="${m}"></i>${p.medals[m]}</div>`).join('')}</div>
    <h3>Last ${hist.length || ''} scores</h3>
    ${hist.length ? `<div class="bars" role="img" aria-label="Bar chart of your last ${hist.length} scores">${hist.map(s => `<i style="height:${Math.max(3, s / mx * 100)}%" title="${s}"></i>`).join('')}</div>` : '<p class="muted">Play a game to see your score history.</p>'}`;
}
let resetArmed = false;
function renderSettings() {
  const chk = (key, label, sub, on) => `<label class="row"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" data-set="${key}" ${on ? 'checked' : ''}></label>`;
  sheetBody.innerHTML = `
    <label class="row"><span>Music</span><input type="range" min="0" max="1" step="0.05" value="${settings.music}" data-set="music" aria-label="Music volume"></label>
    <label class="row"><span>Sound effects</span><input type="range" min="0" max="1" step="0.05" value="${settings.sfx}" data-set="sfx" aria-label="Sound effects volume"></label>
    ${chk('muted', 'Mute everything', 'Shortcut: M', settings.muted)}
    ${chk('reduceMotion', 'Reduce motion', 'No screen shake, flashes or slow motion', reduced())}
    ${chk('contrast', 'High-contrast pipes', 'Easier to see with color vision differences', settings.contrast)}
    ${chk('haptics', 'Vibration', 'On phones that support it', settings.haptics)}
    <button class="danger" data-act="reset">${resetArmed ? 'Tap again to erase all progress' : 'Reset progress'}</button>`;
}

sheetBody.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'bird' || act === 'world') {
    const item = (act === 'bird' ? BIRDS : WORLD_LIST).find(x => x.id === id);
    if (!unlocked(item)) { toast(`Locked: ${item.hint}`); return; }
    if (act === 'bird') progress.bird = id; else progress.world = id;
    sfx.click(); saveLocal(); syncRemoteProgress(); renderShop();
  } else if (act === 'reset') {
    if (!resetArmed) { resetArmed = true; renderSettings(); setTimeout(() => { if (resetArmed) { resetArmed = false; if (sheet === 'settings') renderSettings(); } }, 4000); return; }
    resetArmed = false; progress = freshProgress(); saveLocal(); syncRemoteProgress(); renderSettings(); toast('Progress erased'); reset();
  } else if (act === 'tab') {
    ranksTab = id; renderRanks();
  }
});
sheetBody.addEventListener('input', e => {
  const k = e.target.dataset.set;
  if (!k) return;
  if (e.target.type === 'range') settings[k] = parseFloat(e.target.value);
  else settings[k] = e.target.checked;
  saveLocal(); syncUI();
});

// ===================== Shared leaderboard & cloud save (db capability) =====================
let db = null, usr = null, uid = null, myScore = null, scoresReadOnly = false;
let lbAll = null, lbDaily = null, lbSubscribed = false, ranksTab = 'all', ranksToken = 0;
let progressChain = Promise.resolve(), scoreChain = Promise.resolve();
const hasClaude = typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function';

async function initRemote() {
  if (!hasClaude) return;
  try { [db, usr] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { db = null; usr = null; }
  if (!db || !usr) return;
  try { uid = await usr.id(); } catch (e) { uid = null; }
  if (!uid) return;
  try {
    const snap = await db.doc(`data/users/${uid}/progress`).get();
    if (snap.exists) {
      const remote = sanitize(snap.data());
      if (remote.games > progress.games) { progress = remote; saveLocal(); if (state === 'ready') renderReady(); if (sheet) renderSheet(); }
    }
  } catch (e) {}
  try { const s = await db.doc('scores/' + uid).get(); if (s.exists) myScore = s.data(); } catch (e) {}
  if (sheet === 'ranks') renderRanks();
}
function syncRemoteProgress() {
  if (!db || !uid) return;
  const copy = JSON.parse(JSON.stringify(progress));
  progressChain = progressChain.then(() => db.doc(`data/users/${uid}/progress`).set(copy)).catch(() => {});
}
function submitScore() {
  if (!db || !uid || scoresReadOnly || score <= 0) return;
  const t = todayStr(), cur = myScore || {};
  const next = { best: Number(cur.best) || 0, dailyDate: String(cur.dailyDate || ''), dailyScore: Number(cur.dailyScore) || 0, bird: curBird(), at: Date.now() };
  let changed = false;
  if (mode === 'classic' && score > next.best) { next.best = score; changed = true; }
  if (mode === 'daily') {
    if (next.dailyDate !== t) { next.dailyDate = t; next.dailyScore = score; changed = true; }
    else if (score > next.dailyScore) { next.dailyScore = score; changed = true; }
  }
  if (!changed) return;
  myScore = next;
  scoreChain = scoreChain.then(() => db.doc('scores/' + uid).set(next)).catch(e => { if (e && e.code === 'invalid_argument') scoresReadOnly = true; });
}
function subscribeRanks() {
  if (lbSubscribed || !db) return;
  lbSubscribed = true;
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  try {
    db.collection('scores').where('best', '>', 0).orderBy('best', 'desc').limit(20)
      .onSnapshot(s => { lbAll = rows(s); if (sheet === 'ranks') renderRanks(); }, () => { lbAll = 'error'; if (sheet === 'ranks') renderRanks(); });
    db.collection('scores').where('dailyDate', '==', todayStr()).orderBy('dailyScore', 'desc').limit(20)
      .onSnapshot(s => { lbDaily = rows(s); if (sheet === 'ranks') renderRanks(); }, () => { lbDaily = 'error'; if (sheet === 'ranks') renderRanks(); });
  } catch (e) { lbAll = lbDaily = 'error'; }
}
async function renderRanks() {
  const token = ++ranksToken;
  const tabs = `<div class="tabs"><button data-act="tab" data-id="all" class="${ranksTab === 'all' ? 'on' : ''}">All time</button><button data-act="tab" data-id="daily" class="${ranksTab === 'daily' ? 'on' : ''}">Today’s daily</button></div>`;
  if (!db) { sheetBody.innerHTML = tabs + '<p class="muted">The shared leaderboard isn’t available in this view. Your scores are still saved on this device.</p>'; return; }
  const list = ranksTab === 'all' ? lbAll : lbDaily;
  if (list === null) { sheetBody.innerHTML = tabs + '<p class="muted">Loading scores…</p>'; return; }
  if (list === 'error') { sheetBody.innerHTML = tabs + '<p class="muted">Couldn’t load the leaderboard. Close this and try again.</p>'; return; }
  const key = ranksTab === 'all' ? 'best' : 'dailyScore';
  const note = !uid ? '<p class="muted">Sign in to claude.ai to post your scores here.</p>'
    : scoresReadOnly ? '<p class="muted">You can view the leaderboard, but posting scores needs Contributor access to this page.</p>' : '';
  if (!list.length) { sheetBody.innerHTML = tabs + `<p class="muted">${ranksTab === 'all' ? 'No scores yet. Play a classic run to claim first place.' : 'Nobody has flown today’s course yet. Switch to Daily and set the bar.'}</p>` + note; return; }
  let ps = {};
  try { if (usr) ps = await usr.profiles(list.map(r => r.id)); } catch (e) {}
  if (token !== ranksToken || sheet !== 'ranks') return;
  sheetBody.innerHTML = tabs + `<div>${list.map((r, i) => {
    const p = ps[r.id] || {}, me = r.id === uid;
    return `<div class="rank${me ? ' me' : ''}"><span class="pos">${i + 1}</span>${p.avatarUrl ? `<img class="av" src="${esc(p.avatarUrl)}" alt="">` : '<span></span>'}
      <span class="nm"></span><img class="bd" src="${birdThumb(SKINS[r.bird] ? r.bird : 'classic')}" alt=""><span class="sc">${Number(r[key]) || 0}</span></div>`;
  }).join('')}</div>` + note;
  sheetBody.querySelectorAll('.rank .nm').forEach((el, i) => { const p = ps[list[i].id] || {}; el.textContent = (p.name || 'Someone') + (list[i].id === uid ? ' (you)' : ''); });
}

// ===================== Share card =====================
let dl = null;
function updateShareVisibility() { shareBtn.classList.toggle('hidden', !(dl || navigator.share)); }
async function makeCard() {
  try { await document.fonts.ready; } catch (e) {}
  const S = 1080, c = makeCanvas(S, S), g = c.getContext('2d'), world = curWorld(), pal = world.palettes[0], m = medalFor(score);
  const gr = g.createLinearGradient(0, 0, 0, S); gr.addColorStop(0, pal.top); gr.addColorStop(1, pal.bot);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  g.save(); g.scale(2.25, 2.25); g.translate(0, (S - 230) / 2.25 - 200);
  paintFar(g, world, pal.far); g.restore();
  g.save(); g.scale(2.25, 2.25); g.translate(0, (S - 230) / 2.25 - 70); paintHills(g, world, pal.near); g.restore();
  g.fillStyle = world.ground.base; g.fillRect(0, S - 230, S, 230); g.fillStyle = world.ground.top; g.fillRect(0, S - 230, S, 40); g.fillStyle = world.ground.edge; g.fillRect(0, S - 190, S, 10);
  const outline = (txt, x, y, size, fill) => { g.font = `${size}px 'Lilita One', 'Arial Rounded MT Bold', sans-serif`; g.textAlign = 'center'; g.lineJoin = 'round'; g.lineWidth = size / 7; g.strokeStyle = '#2b2118'; g.strokeText(txt, x, y); g.fillStyle = fill; g.fillText(txt, x, y); };
  outline('Flappy Pro', S / 2, 150, 110, '#ffffff');
  const spr = birdSprites(curBird()).frames[1];
  g.save(); g.translate(S / 2, 330); g.rotate(-0.2); g.drawImage(spr, -150, -122, 300, 244); g.restore();
  outline(String(score), S / 2, 690, 260, '#ffd23f');
  outline(score === 1 ? 'pipe cleared' : 'pipes cleared', S / 2, 770, 56, '#ffffff');
  if (m) {
    const cols = { bronze: ['#f3c39a', '#c7783e'], silver: ['#ffffff', '#9aa6b2'], gold: ['#fff4b0', '#e2b400'], platinum: ['#ffffff', '#8fd3df'] }[m];
    const mg = g.createRadialGradient(150, 600, 10, 170, 620, 80); mg.addColorStop(0, cols[0]); mg.addColorStop(1, cols[1]);
    g.fillStyle = mg; g.beginPath(); g.arc(170, 620, 75, 0, TAU); g.fill(); g.lineWidth = 8; g.strokeStyle = '#5a3b1f'; g.stroke();
    outline('★', 170, 650, 80, '#ffffff');
    outline(m[0].toUpperCase() + m.slice(1), 170, 740, 40, '#ffffff');
  }
  const d = new Date();
  outline(mode === 'daily' ? `Daily challenge, ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : `${world.name} world`, S / 2, S - 90, 52, '#ffffff');
  return new Promise(res => c.toBlob(res, 'image/png'));
}
async function shareScore() {
  shareBtn.disabled = true;
  try {
    const blob = await makeCard();
    if (!blob) throw new Error('no image');
    const file = new File([blob], 'flappy-pro-score.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Flappy Pro', text: `I scored ${score} in Flappy Pro.` }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    if (dl) { try { await dl.save({ filename: 'flappy-pro-score.png', data: blob }); toast('Score card saved'); } catch (e) {} }
    else toast('Sharing isn’t available here');
  } finally { shareBtn.disabled = false; }
}

// ===================== Input =====================
function press() {
  ensureAudio();
  if (sheet) return;
  if (paused) { setPaused(false); return; }
  if (state === 'ready') { start(); flapQueued = true; }
  else if (state === 'playing') { if (countdown <= 0) flapQueued = true; }
  else if (state === 'over') restart();
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, input, label, .sheet-wrap')) return;
  e.preventDefault(); press();
});
window.addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'Escape') { if (sheet) { closeSheet(); return; } if (paused) setPaused(false); else setPaused(true); return; }
  if (sheet) return;
  if (e.repeat) { if (k === 'Space') e.preventDefault(); return; }
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') { e.preventDefault(); press(); }
  else if (k === 'Enter' && state === 'over') { e.preventDefault(); restart(); }
  else if (k === 'KeyP') { paused ? setPaused(false) : setPaused(true); }
  else if (k === 'KeyM') { ensureAudio(); settings.muted = !settings.muted; saveLocal(); syncUI(); toast(settings.muted ? 'Sound off' : 'Sound on'); }
});
for (const b of document.querySelectorAll('.menu-btn')) b.addEventListener('click', () => { ensureAudio(); sfx.click(); openSheet(b.dataset.sheet); });
for (const b of document.querySelectorAll('.modes button')) b.addEventListener('click', () => { ensureAudio(); sfx.click(); mode = b.dataset.mode; reset(); });
$('sheetClose').addEventListener('click', closeSheet);
sheetWrap.addEventListener('pointerdown', e => { if (e.target === sheetWrap) closeSheet(); });
replayBtn.addEventListener('click', () => { replayBtn.blur(); restart(); });
shareBtn.addEventListener('click', () => { shareBtn.blur(); shareScore(); });
pauseBtn.addEventListener('click', () => { pauseBtn.blur(); setPaused(true); });
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('pauseSettingsBtn').addEventListener('click', () => openSheet('settings'));
$('quitBtn').addEventListener('click', () => { paused = false; reset(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
window.addEventListener('blur', () => setPaused(true));
rmQuery.addEventListener?.('change', syncUI);

// ===================== Layout: fit any screen, sharp on high-DPI =====================
function fit() {
  const hintH = hint.offsetHeight + 14;
  const aw = document.body.clientWidth - 20, ah = document.body.clientHeight - hintH - 20;
  const s = clamp(Math.min(aw / W, ah / H), 0.4, 1.5);
  wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px';
  stage.style.transform = `scale(${s})`;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
  ratio = canvas.width / W;
  layerCache.clear();
}
window.addEventListener('resize', fit);

// ===================== Init =====================
fit();
reset();
updateShareVisibility();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
initRemote();
if (hasClaude) window.claude.use('downloads').then(n => { dl = n; updateShareVisibility(); }).catch(() => {});
})();
</script>
